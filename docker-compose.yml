services:
  postgres:
    image: postgres:16
    container_name: ekh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekh
      POSTGRES_PASSWORD: ekh_dev_password
      POSTGRES_DB: ekh
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ekh-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekh -d ekh"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ekh-pgdata:
